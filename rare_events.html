<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rare Events</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; padding: 20px; overflow: hidden;}
  button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background: #4caf50; color: white;}
  
  #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 50; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; perspective: 1000px;}
  #overlay.active { display: flex; animation: fadeIn 0.3s; }
  
  .box { width: 120px; height: 120px; background: gold; border-radius: 15px; animation: bounce 0.8s infinite alternate; box-shadow: 0 0 40px gold;}
  .card { width: 160px; height: 240px; background: linear-gradient(45deg, #ff416c, #ff4b2b); border-radius: 15px; transform-style: preserve-3d; transition: transform 0.6s; display:flex; justify-content:center; align-items:center; font-size: 60px;}
  .card.flip { transform: rotateY(180deg); }
  
  .result { font-size: 100px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; pointer-events:none;}

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
  @keyframes pop { 0% {transform: scale(0);} 100% {transform: scale(1);} }
</style>
</head>
<body>

<button onclick="triggerEvent('box')">Trigger Mystery Box</button>
<button onclick="triggerEvent('card')">Trigger Card Flip</button>

<div id="overlay" onclick="interact()">
  <div id="container"></div>
  <h2 id="msg" style="margin-top:40px;">Tap!</h2>
</div>

<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();
let currentType = '', isOpened = false;

// Generate synth sounds to save tokens/assets
function playSound(type) {
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  
  if(type === 'appear') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  } else if(type === 'win') {
    osc.type = 'square'; osc.frequency.setValueAtTime(400, ctx.currentTime);
    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
    osc.frequency.setValueAtTime(1000, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  }
}

function triggerEvent(type) {
  ctx.resume(); currentType = type; isOpened = false;
  document.getElementById('overlay').className = 'active';
  document.getElementById('msg').innerText = type === 'card' ? 'Tap to Flip!' : 'Tap to Open!';
  document.getElementById('container').innerHTML = type === 'box' ? '<div class="box"></div>' : '<div class="card">❓</div>';
  playSound('appear');
}

function interact() {
  if(isOpened) return document.getElementById('overlay').className = '';
  isOpened = true; playSound('win');
  document.getElementById('msg').innerText = 'Awesome! (Tap to close)';
  
  if(currentType === 'box') {
    document.getElementById('container').innerHTML = '<div class="result">💎</div>';
    createConfetti();
  } else {
    document.querySelector('.card').classList.add('flip');
    setTimeout(() => { document.querySelector('.card').innerHTML = '🦄'; createConfetti(); }, 200);
  }
}

function createConfetti() {
  for(let i=0; i<40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.background = ['#ff0','#f0f','#0ff','#0f0'][Math.floor(Math.random()*4)];
    p.style.left = window.innerWidth/2 + 'px';
    p.style.top = window.innerHeight/2 + 'px';
    document.body.appendChild(p);
    
    const angle = Math.random() * Math.PI * 2, vel = 15 + Math.random() * 20;
    let x = 0, y = 0;
    const anim = setInterval(() => {
      x += Math.cos(angle) * vel; y += Math.sin(angle) * vel + 3;
      p.style.transform = `translate(${x}px, ${y}px)`;
      if(y > window.innerHeight) { clearInterval(anim); p.remove(); }
    }, 20);
  }
}
</script>
</body>
</html>
